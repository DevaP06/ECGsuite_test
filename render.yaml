# Render Blueprint — ml-api (digitizer + DL model orchestrator + ontology caller).
# PUBLIC web service: the Vercel backend calls it (FLASK_URL → this service's URL).
# Apply: Render Dashboard → New → Blueprint → connect this repo (ECGSuite).
#
# Note: dockerfilePath is relative to the repo root; rootDir is the Docker build
# context (the ml-api Dockerfile's COPY paths are relative to backend/ml).
services:
  - type: web                   # public — gets https://ecg-ml-api.onrender.com
    name: ecg-ml-api
    runtime: docker
    region: singapore           # MUST match ecg-digitizer / ecg-ontology
    plan: standard              # torch + model weights need ~2 GB RAM
    rootDir: backend/ml
    dockerfilePath: ./backend/ml/Dockerfile
    healthCheckPath: /          # ml_api.py GET / returns {"status":"healthy"}
    autoDeploy: true
    envVars:
      - key: PORT               # container CMD listens on 8001
        value: "8001"
      # Internal URLs of the two private services (same region, private network):
      - key: DIGITIZER_URL
        value: http://ecg-digitizer:8000/extract-signal
      - key: ONTOLOGY_URL
        value: http://ecg-ontology:8002/diagnose
